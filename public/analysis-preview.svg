  <text x="520" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">5.114</text>
  <text x="620" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">&lt; .001</text>
