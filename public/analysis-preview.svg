  <circle cx="78" cy="392" r="14" fill="#22c55e" />
  <path d="M72 392 L76 396 L85 387" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="105" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d">
